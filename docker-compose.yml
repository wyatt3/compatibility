services:
  api:
    build: ./server
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=http://localhost:${WEB_PORT}
    ports:
      - "${API_PORT}:3000"
    restart: unless-stopped

  web:
    build: ./client
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:80"
    restart: unless-stopped
